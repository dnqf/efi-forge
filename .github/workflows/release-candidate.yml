name: Release candidate

on:
  workflow_dispatch:

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-nsis:
    name: Build unsigned Windows NSIS candidate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-02
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Verify version synchronization
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -Raw -LiteralPath "src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $cargoText = Get-Content -Raw -LiteralPath "src-tauri/Cargo.toml"
          $cargoMatch = [regex]::Match($cargoText, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw "Cannot read the Cargo package version." }
          $cargoVersion = $cargoMatch.Groups[1].Value
          $appText = Get-Content -Raw -LiteralPath "src/App.tsx"
          if ($packageVersion -ne $tauriVersion -or $packageVersion -ne $cargoVersion -or $appText -notmatch [regex]::Escape("ALPHA $packageVersion")) {
            throw "Version mismatch: package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }
      - run: npm test
      - run: npm run test:catalog
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-features
      - name: Verify pinned upstream components and real candidate assembly
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored --test-threads=1
      - run: npm run desktop:build
      - name: Generate SHA-256 manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated." }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash
          $signature = (Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status
          $version = (Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json).version
          "$digest *$($installer.Name)" | Set-Content -LiteralPath "src-tauri/target/release/bundle/nsis/SHA256SUMS.txt" -Encoding ascii
          @(
            "EFI Forge Windows release candidate"
            "Version: $version"
            "Commit: $env:GITHUB_SHA"
            "File: $($installer.Name)"
            "Size: $($installer.Length) bytes"
            "SHA-256: $digest"
            "Authenticode: $signature"
            "Validation: clean-checkout CI; frontend, catalog, Rust, locked-component and NSIS build gates passed"
            "Scope: candidate EFI tooling; no target-machine boot or installation claim"
          ) | Set-Content -LiteralPath "src-tauri/target/release/bundle/nsis/RELEASE-METADATA.txt" -Encoding utf8
          "### Unsigned release candidate" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- Commit: ``$env:GITHUB_SHA``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- $($installer.Name)" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$digest``" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: efi-forge-windows-unsigned-candidate
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/RELEASE-METADATA.txt
          if-no-files-found: error
          retention-days: 14
